<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tomorrow" />
    <title>Tomorrow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127869;</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If anything throws before React mounts, show it instead of a blank page.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.childElementCount === 0) {
          var m = (e && e.message) || (e && e.error) || 'Failed to load a script';
          r.innerHTML = '<pre style="white-space:pre-wrap;padding:20px;font:13px monospace;color:#000">Startup error:\n' + m + '</pre>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
